
services:
  postgres:
    image: postgres:16
    container_name: hades-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: hades
      POSTGRES_PASSWORD: hades123
      POSTGRES_DB: hades
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"

  qdrant:
    image: qdrant/qdrant
    container_name: hades-qdrant
    restart: unless-stopped
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "6333:6333"

  n8n:
    image: n8nio/n8n
    container_name: hades-n8n
    restart: unless-stopped
    environment:
      - N8N_SECURE_COOKIE=false
    ports:
      - "5678:5678"
    volumes:
      - n8n_data:/home/node/.n8n

volumes:
  postgres_data:
  qdrant_data:
  n8n_data:
